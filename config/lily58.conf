# Uncomment to enable encoder (do not set =n, it breaks the build)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
# CONFIG_ZMK_DISPLAY=y

# nice!view with zmk-nice-oled widgets (nice_epaper shield)
CONFIG_ZMK_DISPLAY=y

# WPM widget: Luna dog + numeric WPM readout, no Bongo Cat
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y

# No modifiers indicator block (its epaper default position is broken anyway)
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n

# No HID indicator block either; it only ever renders an empty string
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Milliseconds of inactivity before entering deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# improve connection stability (experimental)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Raise BLE transmit power to +8 dBm for more signal margin in noisy offices
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
