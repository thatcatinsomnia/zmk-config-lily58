# Lily58 / nice!nano v2. Applies to both halves.
#   LEFT  = central, nice_epaper shield (zmk-nice-oled widgets)
#   RIGHT = peripheral, nice_view_cats shield (vendored in boards/shields/)
# The NICE_OLED_* lines below are silently ignored on the right half.

# --- Display -----------------------------------------------------------------
# Redundant: both shields' own .conf already set this. Kept to document intent.
CONFIG_ZMK_DISPLAY=y

# --- zmk-nice-oled widgets (left half only) ----------------------------------
# Luna dog instead of Bongo Cat, plus the numeric WPM readout.
# The animation runs on its own timer (960 ms idle / 200 ms typing, hardcoded in
# luna.c), not on keystrokes, and the left screen blanks after 30 s anyway.
# Costs roughly +1.7 uA averaged, i.e. nothing.
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y

# Off for cosmetic reasons, but it is also the best power line here: this widget
# subscribes to zmk_keycode_state_changed and redraws the whole canvas on every
# single keypress.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n

# Defaults on, and drags in CONFIG_ZMK_HID_INDICATORS with it. Its own Luna and
# Bongo Cat variants are separate symbols that both default off, so the widget
# ends up rendering an empty string: we were paying for the host->keyboard LED
# report plumbing to draw nothing.
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n

# --- Encoder -----------------------------------------------------------------
# No encoder is fitted. This has to be an explicit =n: CONFIG_EC11 is `default y`
# and gated on devicetree, not on this file, and lily58.dtsi has an encoder node.
# The old commented-out "# CONFIG_EC11=y" was disabling nothing - the driver was
# built on both halves and logged "Failed to set sensor trigger" at every boot.
CONFIG_EC11=n

# --- Power -------------------------------------------------------------------
# The one line in this file that matters. CONFIG_ZMK_SLEEP is a bare bool with no
# `default y` (app/Kconfig:396), so stock ZMK NEVER deep-sleeps - it idles at 30 s
# and stays connected forever. Worth roughly 2.7x on the left half.
CONFIG_ZMK_SLEEP=y

# 20 minutes (ZMK's default is 15). Waking from deep sleep is a reboot, not a
# resume: a few seconds to reconnect, and the keypress that woke it is discarded.
# Each half counts its own idle time - there is no activity propagation across the
# split link - so typing on the left does not keep the right awake. Raise this if
# "the first keypress got eaten" starts happening on the half you touch less.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# --- Bluetooth ---------------------------------------------------------------
# Despite the name, in ZMK v0.3 this does exactly one thing: BT_CTLR_PHY_2M=n
# (app/Kconfig:185). It is a stability setting, not a power or latency one, and
# dropping 2M PHY means each packet spends about twice as long on air - so it is a
# small cost, not a saving. Kept because it was added for a real Windows problem.
# First thing to suspect if disconnects ever come back.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# +8 dBm transmit power, for signal margin in noisy rooms. ZMK's own connection
# troubleshooting docs recommend it and call the power difference negligible;
# nobody has measured it on a split. Removing it costs range, nothing else.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Deliberately absent, do not re-add --------------------------------------
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y  both shields already default this
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5       Kconfig default is -1, a sentinel
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5     meaning "use the devicetree value",
#                                            and that value is already 5
# CONFIG_ZMK_KEYBOARD_NAME="Lily58"          identical to lily58's own defconfig
# CONFIG_ZMK_EXT_POWER=y                     already `default y` in Kconfig.defaults
# CONFIG_ZMK_IDLE_TIMEOUT=<lower>            only blanks the screen and stops the
#                                            battery ADC; near-zero on a memory LCD
